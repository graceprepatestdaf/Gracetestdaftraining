const S={m:"Lesen",items:[],i:0,sim:false,t:null,end:0,ans:[],scores:{Lesen:0,Hören:0,Schreiben:0,Sprechen:0},max:{Lesen:0,Hören:0,Schreiben:0,Sprechen:0}};

function sh(a){return [...a].sort(()=>Math.random()-.5)}function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function bk(m){return DB[m=="Lesen"?"reading":m=="Hören"?"listening":m=="Schreiben"?"writing":"speaking"]}
function start(m){clearInterval(S.t);S.m=m;S.i=0;S.sim=false;S.ans=[];S.scores={Lesen:0,Hören:0,Schreiben:0,Sprechen:0};S.max={Lesen:0,Hören:0,Schreiben:0,Sprechen:0};S.items=sh(bk(m)).slice(0,m=="Schreiben"?2:7);render()}

function hd(title,sub){return `<div class="card"><div class="top"><div><span class="badge">${esc(S.m)}</span><h2>${esc(title)}</h2><div class="small">${esc(sub)}</div></div><div id="timer" class="timer">--:--</div></div><div class="progress"><div style="width:${(S.i+1)/S.items.length*100}%"></div></div></div>`}
function clock(sec,done){clearInterval(S.t);S.end=Date.now()+sec*1000;function f(){let r=Math.max(0,S.end-Date.now()),x=Math.ceil(r/1000),e=document.getElementById("timer");if(e){e.textContent=Math.floor(x/60)+":"+String(x%60).padStart(2,"0");e.classList.toggle("warn",x<=15)}if(!r){clearInterval(S.t);done()}}f();S.t=setInterval(f,200)}
function collect(){S.ans.push({m:S.m,i:S.i,v:[...document.querySelectorAll("input:checked,textarea,input[type=text],select")].map(x=>x.value)})}
function next(){collect();if(S.i<S.items.length-1){S.i++;render()}else if(S.sim&&S.m=="Lesen"){S.m="Hören";S.i=0;S.items=sh(bk("Hören")).slice(0,7);render()}else if(S.sim&&S.m=="Hören"){S.m="Schreiben";S.i=0;S.items=sh(bk("Schreiben")).slice(0,2);render()}else if(S.sim&&S.m=="Schreiben"){S.m="Sprechen";S.i=0;S.items=sh(bk("Sprechen")).slice(0,7);render()}else if(S.sim){correction()}else correction()}
function render(){if(S.m=="Lesen")lesen();else if(S.m=="Hören")hoeren();else if(S.m=="Schreiben")schreiben();else sprechen()}
function lesen(){let d=S.items[S.i],types=["Lückentext ergänzen","Textabschnitte ordnen","Multiple-Choice","Sprachhandlungen zuordnen","Aussagen Kategorien zuordnen","Aussagen einem Begriffspaar zuordnen","Fehler in Zusammenfassung erkennen"],type=types[S.i];S.max.Lesen+=S.i==2?7:S.i==0?5:S.i==1?4:S.i==3?4:S.i==4?7:S.i==5?4:3;let c="";
if(S.i==2)c=[1,2,3,4,5,6,7].map(n=>`<div class="card"><b>${n}. Welche Aussage ist aufgrund des Textes am ehesten richtig?</b>${sh(["Die Forschung verlangt eine differenzierte Betrachtung.","Eine einzige Maßnahme reicht immer aus.","Der Kontext spielt keine Rolle.","Empirische Daten sind unnötig."]).map((x,j)=>`<label class="option"><input type="radio" name="r${n}">${x}</label>`).join("")}</div>`).join("");

else if(S.i==1)c=["Problemstellung","Erklärung","Beleg","Einschränkung","Schlussfolgerung"].map((x,n)=>`<label class="option">${x}: <select>${[1,2,3,4,5].map(y=>`<option>${y}</option>`).join("")}</select></label>`).join("");
else if(S.i==3)c=["Ursache erklären","Einschränkung formulieren","Ergebnis zusammenfassen","Konsequenz ableiten"].map((x,n)=>`<label class="option">${n+1}. ${x}<select><option>A</option><option>B</option><option>C</option><option>D</option></select></label>`).join("");

function sprechen(){let d=S.items[S.i],prep=d.time==45?30:d.time==90?45:60;document.getElementById("app").innerHTML=hd("Sprechen",`Aufgabe ${S.i+1}/7 · ${d.type} · Vorbereitung ${prep}s · Sprechzeit ${d.time}s`)+`<div class="card"><h3>${esc(d.type)}</h3><p>${esc(d.task)}</p><div class="note">Vorbereitung und Sprechzeit laufen automatisch. Die Aufgabe endet ohne Korrektur.</div><button onclick="mic()">🎙️ Aufnahme</button><audio id="aud" controls class="hidden"></audio></div>`;setTimeout(()=>clock(prep,()=>clock(d.time,next)),30)}
let rec,ch=[];function mic(){if(!navigator.mediaDevices)return;navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{ch=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{let a=document.getElementById("aud");a.src=URL.createObjectURL(new Blob(ch,{type:"audio/webm"}));a.classList.remove("hidden")};rec.start();setTimeout(()=>{if(rec.state!="inactive")rec.stop();st.getTracks().forEach(t=>t.stop())},S.items[S.i].time*1000)}).catch(()=>{})}
